# CodeQL configuration, used by .github/workflows/codeql.yaml on top of the
# security-extended suite. Each exclusion is a source of false positives only.
name: pupitre2

paths-ignore:
  # Generated by MSW (`msw init`), served in mock mode only.
  - apps/app/public/mockServiceWorker.js
  # Course content: markdown in YAML, read as configuration by the JavaScript
  # extractor (an example password in a lesson is not a secret).
  - apps/api/internal/courses/db/seed/courses

query-filters:
  # The API logs through zap's structured fields, which escape control
  # characters: user input cannot forge a log entry.
  - exclude:
      id: go/log-injection
