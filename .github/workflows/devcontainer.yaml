name: Dev container

# The development environment (.devcontainer/, tools from mise.toml): build
# the image, then build the frontend and the API inside it, as a contributor
# would after "Reopen in Container".

on:
  push:
    branches: [main]
    paths: [".devcontainer/**", "mise.toml", "package.json", "apps/api/go.mod", ".github/workflows/devcontainer.yaml"]
  pull_request:
    paths: [".devcontainer/**", "mise.toml", "package.json", "apps/api/go.mod", ".github/workflows/devcontainer.yaml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build the project in the dev container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          runCmd: mise run build && mise run api:build
