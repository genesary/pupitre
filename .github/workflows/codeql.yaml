name: CodeQL

# GitHub's code scanning: data-flow analysis of the TypeScript of the apps
# and packages, the Go of apps/api and the workflows themselves. Findings go
# to the Security tab and annotate pull requests.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, for queries added since the last change.
    - cron: '17 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: go
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        if: ${{ matrix.language == 'go' }}
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - name: Build pupitre-api
        if: ${{ matrix.build-mode == 'manual' }}
        working-directory: apps/api
        run: go build ./...
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
