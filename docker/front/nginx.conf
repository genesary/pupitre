# The frontend's static server:
# /admin/* and /manager/* get the admin app's page, every other path the
# learner app's. /api and /uploads are routed to pupitre-api by the ingress,
# never by this server.

server {
    listen 3000;
    server_name _;
    server_tokens off;

    # Behind the ingress, the scheme and port nginx sees are not the public
    # ones: an absolute redirect would send /admin to http://host:3000/admin/.
    absolute_redirect off;

    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The pages are never cached, so a new release is picked up at once.
    location = /index.html {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    location = /admin/index.html {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    # Built assets carry a content hash in their name.
    location ~ ^/(admin/)?assets/ {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        include /etc/nginx/security-headers.inc;
        try_files $uri /admin/index.html;
    }

    # A rewrite, not try_files: the page must get the Cache-Control of
    # /admin/index.html above.
    location /manager {
        rewrite ^ /admin/index.html last;
    }

    location / {
        include /etc/nginx/security-headers.inc;
        try_files $uri /index.html;
    }
}
