# The frontend's static server (docs/specs/000-scope-and-stack.md):
# /admin/* and /manager/* get the admin app's page, every other path the
# learner app's. /api and /uploads are routed to pupitre-api by the ingress,
# never by this server.

server {
    listen 3000;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The pages are never cached, so a new release is picked up at once.
    location = /index.html {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    location = /admin/index.html {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    # Built assets carry a content hash in their name.
    location ~ ^/(admin/)?assets/ {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        include /etc/nginx/security-headers.inc;
        try_files $uri /admin/index.html;
    }

    location /manager {
        include /etc/nginx/security-headers.inc;
        try_files /admin/index.html =404;
    }

    location / {
        include /etc/nginx/security-headers.inc;
        try_files $uri /index.html;
    }
}
