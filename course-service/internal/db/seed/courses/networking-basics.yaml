    - name: "Modèle TCP/IP et protocoles"
      type: text
      skills:
        - reseaux
      content: |
        ## Modèle TCP/IP et protocoles

        Internet fonctionne en couches — chaque couche a un rôle précis et communique uniquement avec les couches adjacentes.

        ### Les 4 couches TCP/IP

        | Couche | Rôle | Protocoles |
        |---|---|---|
        | **Application** | Ce que voit l'utilisateur | HTTP, HTTPS, DNS, SSH, FTP |
        | **Transport** | Fiabilité, ports | TCP, UDP |
        | **Internet** | Routage entre réseaux | IP, ICMP, ARP |
        | **Réseau** | Transmission physique | Ethernet, Wi-Fi |

        ### TCP vs UDP

        ```
        TCP (fiable)                    UDP (rapide)
        ────────────────────────────    ────────────────────────
        Connexion établie (handshake)   Pas de connexion
        Accusé de réception             Pas de garantie
        Ordre des paquets garanti       Ordre non garanti
        → HTTP, SSH, bases de données   → DNS, streaming, jeux
        ```

        ### Ports importants

        | Port | Protocole | Usage |
        |---|---|---|
        | 22 | SSH | Administration distante chiffrée |
        | 80 | HTTP | Web non chiffré |
        | 443 | HTTPS | Web chiffré |
        | 53 | DNS | Résolution de noms |
        | 5432 | PostgreSQL | Base de données |
        | 6379 | Redis | Cache |

        ```bash
        # Voir les ports ouverts sur ta machine
        ss -tlnp

        # Tester si un port est ouvert
        nc -zv 10.0.0.1 443
        ```

    - name: "Adressage IP et sous-réseaux"
      type: text
