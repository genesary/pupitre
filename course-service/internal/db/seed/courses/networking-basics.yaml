      content: |
        ## Adressage IP et sous-réseaux

        ### Adresses IPv4

        Une adresse IPv4 est composée de 4 octets (32 bits) : `192.168.1.100`

        #### Plages privées (non routables sur internet)

        | Plage | Usage courant |
        |---|---|
        | `10.0.0.0/8` | Réseaux d'entreprise |
        | `172.16.0.0/12` | Clusters (Kubernetes, Docker) |
        | `192.168.0.0/16` | Réseaux domestiques |

        ### Notation CIDR

        ```
        192.168.1.0/24
                   ↑
                   24 bits de masque réseau → 256 adresses (254 hôtes)
        ```

        | Notation | Masque | Hôtes disponibles |
        |---|---|---|
        | `/32` | `255.255.255.255` | 1 hôte (adresse unique) |
        | `/24` | `255.255.255.0` | 254 hôtes |
        | `/16` | `255.255.0.0` | 65 534 hôtes |
        | `/8`  | `255.0.0.0` | 16 millions d'hôtes |

        ### Commandes utiles

        ```bash
        ip addr show eth0              # adresse IP de l'interface
        ip route show                  # passerelle par défaut
        cat /etc/resolv.conf           # serveurs DNS configurés
        nslookup google.com            # résoudre un nom DNS
        dig +short google.com A        # résolution DNS précise
        curl ifconfig.me               # ton IP publique
        ```

    - name: "Pare-feux et sécurité réseau"
      type: text
      skills:
        - reseaux
      content: |
        ## Pare-feux et sécurité réseau

        Un pare-feu filtre le trafic réseau selon des règles. Il est la première ligne de défense d'un système.

        ### iptables / nftables

        ```bash
        # Voir les règles actives
        iptables -L -v -n

        # Bloquer une IP
        iptables -A INPUT -s 1.2.3.4 -j DROP

        # Autoriser le trafic entrant sur le port 443
        iptables -A INPUT -p tcp --dport 443 -j ACCEPT

        # Bloquer tout sauf SSH et HTTPS
        iptables -P INPUT DROP
        iptables -A INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT
        iptables -A INPUT -p tcp --dport 22 -j ACCEPT
        iptables -A INPUT -p tcp --dport 443 -j ACCEPT
        ```

        ### ufw — pare-feu simplifié (Ubuntu)

        ```bash
        ufw enable                     # activer
        ufw status verbose             # voir l'état et les règles
        ufw allow 22/tcp               # autoriser SSH
        ufw allow 443                  # autoriser HTTPS
        ufw deny 3306                  # bloquer MySQL depuis l'extérieur
        ufw delete allow 80            # supprimer une règle
        ```

        ### Bonnes pratiques de sécurité réseau

        ```bash
        # Désactiver la connexion SSH par mot de passe (clé uniquement)
        # /etc/ssh/sshd_config :
        PasswordAuthentication no
        PermitRootLogin no
        AllowUsers alice bob

        # Scanner son propre réseau pour détecter les ports ouverts
        nmap -sV -O 192.168.1.0/24

        # Vérifier les connexions actives suspectes
        ss -tnp | grep ESTABLISHED
        ```

        ### fail2ban — protection anti-brute force

        ```bash
        # Installer et activer
        apt install fail2ban
        systemctl enable --now fail2ban

        # Voir les IPs bannies
        fail2ban-client status sshd

        # Débannir une IP
        fail2ban-client set sshd unbanip 1.2.3.4
        ```
