    - name: "Les menaces du web"
      type: text
      skills:
        - cybersecurite
      content: |
        ## Les menaces du web

        Les applications web sont exposées à de nombreuses attaques. Connaître les vecteurs les plus courants est la première étape pour s'en protéger.

        | Menace | Description |
        |---|---|
        | **Injection SQL** | Injection de code SQL dans un champ de formulaire pour manipuler la base de données |
        | **XSS** | Injection de scripts malveillants dans des pages vues par d'autres utilisateurs |
        | **CSRF** | Forcer un utilisateur authentifié à exécuter une action non désirée |
        | **IDOR** | Accès à des ressources d'autres utilisateurs en modifiant un identifiant |
        | **Broken Auth** | Mécanismes d'authentification mal implémentés |

        ```http
        # Exemple d'injection SQL
        POST /login HTTP/1.1
        username=admin'--&password=anything

        # La requête SQL générée :
        SELECT * FROM users WHERE username='admin'--' AND password='anything'
        -- Le -- commente le reste, le mot de passe est ignoré
        ```

        ### Principe de défense en profondeur

        - Ne jamais faire confiance aux données en entrée
        - Valider côté serveur (jamais uniquement côté client)
        - Appliquer le principe du moindre privilège
        - Logger et monitorer les accès suspects

    - name: "OWASP Top 10"
      type: text
      skills:
        - cybersecurite
      content: |
        ## OWASP Top 10

        L'OWASP (Open Web Application Security Project) publie régulièrement les 10 risques les plus critiques pour la sécurité des applications web.

        ### Top 10 (2021)

        | Rang | Risque |
        |---|---|
        | A01 | Broken Access Control |
        | A02 | Cryptographic Failures |
        | A03 | Injection |
        | A04 | Insecure Design |
        | A05 | Security Misconfiguration |
        | A06 | Vulnerable & Outdated Components |
        | A07 | Identification & Authentication Failures |
        | A08 | Software & Data Integrity Failures |
        | A09 | Security Logging & Monitoring Failures |
        | A10 | Server-Side Request Forgery (SSRF) |

        ### Exemples concrets

        **A01 - Broken Access Control**
        ```http
        GET /api/users/42/documents   # ton compte
        GET /api/users/43/documents   # compte d'un autre → doit retourner 403
        ```

        **A03 - Injection**
        ```python
        # Vulnérable
        query = f"SELECT * FROM users WHERE id = {user_input}"

        # Sécurisé (requête paramétrée)
        query = "SELECT * FROM users WHERE id = $1"
        cursor.execute(query, (user_input,))
        ```

    - name: "Authentification et gestion des sessions"
      type: text
      skills:
        - cybersecurite
      content: |
        ## Authentification et gestion des sessions

        L'authentification vérifie qui tu es. La gestion des sessions maintient cette identité entre les requêtes.

        ### Bonnes pratiques pour les mots de passe

        ```python
        import bcrypt

        # Hachage (à l'inscription)
        password = b"mon_mot_de_passe"
        hashed = bcrypt.hashpw(password, bcrypt.gensalt(rounds=12))

        # Vérification (à la connexion)
        bcrypt.checkpw(password, hashed)  # True/False
        ```

        > Ne jamais stocker un mot de passe en clair ou en MD5/SHA1 — utiliser bcrypt, argon2 ou scrypt.

        ### JWT (JSON Web Token)

        ```
        Header.Payload.Signature

        eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1c2VyMSIsInJvbGUiOiJzdHVkZW50IiwiZXhwIjoxNzAwMDAwMDAwfQ.abc123
        ```

        - **Header** : algorithme de signature
        - **Payload** : claims (sub, exp, role…) — lisible par tous, ne pas y mettre de données sensibles
        - **Signature** : garantit l'intégrité, vérifiée par le serveur avec la clé secrète

        ### Sécurisation des sessions

        ```http
        Set-Cookie: session=xyz; HttpOnly; Secure; SameSite=Strict; Max-Age=3600
        ```

        - `HttpOnly` : interdit l'accès au cookie via JavaScript (protection XSS)
        - `Secure` : cookie transmis uniquement en HTTPS
        - `SameSite=Strict` : protection CSRF

    - name: "Chiffrement et cryptographie"
      type: text
      skills:
        - cybersecurite
      content: |
        ## Chiffrement et cryptographie

        La cryptographie protège les données en transit et au repos.

        ### Chiffrement symétrique vs asymétrique

        | | Symétrique | Asymétrique |
        |---|---|---|
        | **Clés** | Une seule clé partagée | Paire publique/privée |
        | **Vitesse** | Rapide | Lent |
        | **Algorithme** | AES-256 | RSA, Ed25519 |
        | **Usage** | Données au repos | Échange de clés, signatures |

        ### TLS (HTTPS)

        ```
        1. Client → Serveur : ClientHello (versions TLS supportées)
        2. Serveur → Client : Certificat (clé publique + identité)
        3. Échange de clé de session (chiffrement asymétrique)
        4. Communication chiffrée (AES avec la clé de session)
        ```

        ### Bonnes pratiques

        ```bash
        # Générer une clé AES-256
        openssl rand -hex 32

        # Chiffrer un fichier
        openssl enc -aes-256-cbc -salt -in secret.txt -out secret.enc

        # Générer une paire de clés Ed25519
        ssh-keygen -t ed25519 -C "mon@email.com"
        ```

        - Toujours utiliser TLS 1.2+ pour les communications réseau
        - Ne jamais implémenter sa propre cryptographie
        - Renouveler les certificats avant expiration (Let's Encrypt automatise ça)

