    - name: "Le danger des secrets dans le code"
      type: text
      skills:
        - securite
        - devops
      content: |
        ## Le danger des secrets dans le code

        Un **secret** est toute donnée qui donne accès à quelque chose : mot de passe, clé API, token OAuth, certificat privé.

        ### Pourquoi c'est critique

        ```bash
        # Ce genre de code se retrouve partout sur GitHub
        DB_PASSWORD = "supersecret123"
        AWS_SECRET_ACCESS_KEY = "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
        ```

        En 2023, plus de 10 millions de secrets ont été détectés sur GitHub. Une clé AWS exposée quelques minutes peut suffire à générer des milliers d'euros de charges.

        ### L'historique Git ne pardonne pas

        ```bash
        # Même si tu supprimes le secret dans un nouveau commit...
        git log --all --full-history -- config.py
        git show abc1234:config.py   # le secret est toujours là
        ```

        Un `git push --force` ne supprime pas les forks ou les clones existants.

        ### Méthodes de détection

        ```bash
        # Trufflesecurity/trufflehog — scan ton repo
        trufflehog git file://. --only-verified

        # GitLeaks — intégrable en pre-commit hook
        gitleaks detect --source .

        # GitHub Advanced Security — scan automatique sur push
        ```

        ### Règle n°1 : les secrets n'ont jamais leur place dans le code ou le dépôt.

    - name: "Variables d'environnement et fichiers .env"
      type: text
      skills:
        - securite
        - devops
      content: |
        ## Variables d'environnement et fichiers .env

        ### Le pattern .env

        ```bash
        # .env — jamais commité, listé dans .gitignore
        DATABASE_URL=postgres://user:pass@localhost:5432/mydb
        JWT_SECRET=une_chaine_aleatoire_de_32_caracteres
        STRIPE_SECRET_KEY=sk_live_...
        ```

        ```bash
        # .env.example — commité, valeurs fictives
        DATABASE_URL=postgres://user:password@localhost:5432/mydb
        JWT_SECRET=changeme
        STRIPE_SECRET_KEY=sk_test_...
        ```

        ```bash
        # .gitignore
        .env
        .env.local
        .env.production
        ```

        ### Kubernetes Secrets

        ```yaml
        apiVersion: v1
        kind: Secret
        metadata:
          name: db-credentials
        type: Opaque
        stringData:
          username: myuser
          password: supersecret123
        ```

        ```yaml
        # Utilisation dans un Pod
        env:
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-credentials
                key: password
        ```

        > Les Secrets Kubernetes sont encodés en base64, pas chiffrés. Pour du chiffrement at-rest, activer `EncryptionConfiguration` ou utiliser un KMS externe.

        ### Génération de secrets sécurisés

        ```bash
        # 32 octets aléatoires en hexadécimal
        openssl rand -hex 32

        # UUID v4
        python3 -c "import uuid; print(uuid.uuid4())"
        ```

    - name: "HashiCorp Vault"
      type: text
      skills:
        - securite
        - devops
      content: |
        ## HashiCorp Vault

        Vault est un gestionnaire de secrets centralisé : stockage chiffré, accès audité, rotation automatique.

        ### Concepts clés

        | Concept | Description |
        |---|---|
        | **Secret Engine** | Backend de stockage (KV, base de données, PKI…) |
        | **Auth Method** | Comment s'authentifier (token, AppRole, Kubernetes…) |
        | **Policy** | Ce que tu peux lire/écrire |
        | **Lease** | Durée de vie d'un secret dynamique |

        ### Secrets statiques (KV v2)

        ```bash
        # Écrire un secret
        vault kv put secret/myapp db_password="supersecret"

        # Lire un secret
        vault kv get secret/myapp

        # Lire un champ précis (utile en CI/CD)
        vault kv get -field=db_password secret/myapp
        ```

        ### Secrets dynamiques (base de données)

        Vault génère des credentials éphémères à la demande et les révoque automatiquement.

        ```bash
        # Vault crée un user PostgreSQL temporaire avec un TTL
        vault read database/creds/my-role
        # Key               Value
        # username          v-app-xyz123
        # password          A1B2C3D4...
        # lease_duration    1h
        ```

        Après 1h, le compte est automatiquement supprimé de PostgreSQL.

        ### Intégration GitLab CI/CD

        ```yaml
        # .gitlab-ci.yml
        variables:
          VAULT_ADDR: "https://vault.example.com"

        deploy:
          id_tokens:
            VAULT_ID_TOKEN:
              aud: vault
          secrets:
            DB_PASSWORD:
              vault: secret/myapp/db_password@secret
          script:
            - echo "Le secret est disponible comme $DB_PASSWORD"
        ```

