    - name: "Principes de l'IaC"
      type: text
      skills:
        - terraform
        - iac
      content: |
        ## Principes de l'IaC

        L'**Infrastructure as Code** consiste à décrire l'infrastructure (serveurs, réseaux, DNS, bases de données…) dans des fichiers texte versionnés, plutôt que de la configurer manuellement via une interface.

        ### Avantages

        | Manuel (ClickOps) | Infrastructure as Code |
        |---|---|
        | Non reproductible | Reproductible à l'identique |
        | Pas de diff/review | Pull request, code review |
        | Erreurs humaines | Validé avant apply |
        | Undocumenté | Code = documentation |
        | Un seul env difficile à dupliquer | Multi-env trivial |

        ### Concepts clés

        **Idempotence** : appliquer le même code deux fois donne le même résultat. Pas d'effets de bord.

        ```bash
        terraform apply   # crée les ressources si elles n'existent pas
        terraform apply   # ne fait rien si l'état correspond déjà
        ```

        **Infrastructure immuable** : au lieu de modifier un serveur existant, on en crée un nouveau et on détruit l'ancien.

        ```
        v1 → déploiement du serveur A
        v2 → déploiement du serveur B + destruction du serveur A
        ```

        ### Les outils majeurs

        | Outil | Langage | Cloud |
        |---|---|---|
        | **Terraform** | HCL | Multi-cloud |
        | **Pulumi** | TypeScript/Go/Python | Multi-cloud |
        | **OpenTofu** | HCL (fork libre de Terraform) | Multi-cloud |
        | **CloudFormation** | JSON/YAML | AWS uniquement |
        | **Bicep** | DSL | Azure uniquement |

    - name: "Terraform — les bases"
      type: text
      skills:
        - terraform
        - iac
      content: |
        ## Terraform — les bases

        ### Structure d'un projet

        ```
        infra/
        ├── main.tf          # ressources
        ├── variables.tf     # déclaration des variables
        ├── outputs.tf       # valeurs exposées après apply
        ├── terraform.tfvars # valeurs des variables (gitignored si secrets)
        └── versions.tf      # contraintes de version
        ```

        ### Provider et ressource

        ```hcl
        # versions.tf
        terraform {
          required_providers {
            kubernetes = {
              source  = "hashicorp/kubernetes"
              version = "~> 2.30"
            }
          }
        }

        # main.tf
        provider "kubernetes" {
          config_path = "~/.kube/config"
        }

        resource "kubernetes_namespace" "app" {
          metadata {
            name = var.namespace
          }
        }
        ```

        ### Variables et outputs

        ```hcl
        # variables.tf
        variable "namespace" {
          type        = string
          description = "Kubernetes namespace cible"
          default     = "production"
        }

        # outputs.tf
        output "namespace_name" {
          value = kubernetes_namespace.app.metadata[0].name
        }
        ```

        ### Workflow

        ```bash
        terraform init      # télécharger les providers
        terraform plan      # afficher les changements (dry-run)
        terraform apply     # appliquer
        terraform destroy   # tout supprimer
        ```

        Le `plan` est essentiel : il montre exactement ce qui sera créé, modifié ou détruit — à lire attentivement avant l'apply.

    - name: "State et collaboration"
      type: text
      skills:
        - terraform
        - iac
      content: |
        ## State et collaboration

        ### Le state Terraform

        Terraform maintient un fichier `terraform.tfstate` qui représente l'état actuel de l'infrastructure connue.

        ```json
        {
          "resources": [
            {
              "type": "kubernetes_namespace",
              "name": "app",
              "instances": [
                {
                  "attributes": {
                    "metadata": [{"name": "production"}]
                  }
                }
              ]
            }
          ]
        }
        ```

        > Ne jamais éditer `terraform.tfstate` manuellement. Ne jamais le commiter si il contient des secrets.

        ### Remote state — collaboration en équipe

        ```hcl
        # backend S3 (AWS)
        terraform {
          backend "s3" {
            bucket         = "mon-terraform-state"
            key            = "production/terraform.tfstate"
            region         = "eu-west-3"
            dynamodb_table = "terraform-locks"  # verrou anti-concurrence
            encrypt        = true
          }
        }
        ```

        ```hcl
        # backend Kubernetes (pour un cluster local)
        terraform {
          backend "kubernetes" {
            secret_suffix = "production"
            config_path   = "~/.kube/config"
          }
        }
        ```

        ### GitLab CI/CD et Terraform

        ```yaml
        stages:
          - plan
          - apply

        terraform:plan:
          stage: plan
          image: hashicorp/terraform:1.8
          script:
            - terraform init
            - terraform plan -out=tfplan
          artifacts:
            paths:
              - tfplan

        terraform:apply:
          stage: apply
          image: hashicorp/terraform:1.8
          script:
            - terraform init
            - terraform apply tfplan
          when: manual   # déclenché manuellement après review du plan
          only:
            - main
        ```

