      content: |
        ## Shift-left security

        Le "shift-left" consiste à déplacer les contrôles de sécurité le plus tôt possible dans le cycle de développement — là où les corrections coûtent le moins cher.

        ### Coût d'un bug selon le moment de détection

        ```
        Développement  → correction : 1x
        Code review    → correction : 6x
        QA / tests     → correction : 15x
        Production     → correction : 100x
        ```

        ### Les catégories d'outils DevSecOps

        | Type | Acronyme | Ce qu'il fait |
        |---|---|---|
        | Static Analysis | **SAST** | Analyse le code source sans l'exécuter |
        | Dynamic Analysis | **DAST** | Teste l'app en cours d'exécution |
        | Dependency Check | **SCA** | Détecte les librairies avec CVEs |
        | Container Scan | — | Cherche des CVEs dans les images Docker |
        | Secret Detection | — | Cherche des secrets dans le code |
        | IaC Scan | — | Vérifie la sécurité des fichiers Terraform/K8s |

        ### Principe : security as code

        Chaque contrôle est du code versionné, revu et automatisé — pas une checklist manuelle.

        ```yaml
        # .gitlab-ci.yml — pipeline qui inclut tous les scans
        include:
          - template: Security/SAST.gitlab-ci.yml
          - template: Security/Dependency-Scanning.gitlab-ci.yml
          - template: Security/Container-Scanning.gitlab-ci.yml
          - template: Security/Secret-Detection.gitlab-ci.yml
        ```

        En un seul `include`, GitLab ajoute quatre types de scans automatiques à chaque MR.

    - name: "SAST et analyse de dépendances"
      type: text
      skills:
        - devsecops
        - securite
      content: |
        ## SAST et analyse de dépendances

        ### SAST — Static Application Security Testing

        ```yaml
        # GitLab — activation du SAST
        include:
          - template: Security/SAST.gitlab-ci.yml

        variables:
          SAST_EXCLUDED_PATHS: "vendor, node_modules, dist"
        ```

        GitLab utilise différents analyseurs selon le langage détecté :
        - **Go** → gosec
        - **Python** → bandit
        - **JavaScript** → eslint-security
        - **Java** → SpotBugs

        Exemple de résultat gosec :

        ```
        [MEDIUM] G401: Use of weak cryptographic primitive (MD5)
          File: internal/auth/hash.go:12
          Code: h := md5.New()

        [HIGH] G501: Import blocklist: crypto/md5
          File: internal/auth/hash.go:4
        ```

        ### SCA — Software Composition Analysis

        Analyse les dépendances directes et transitives à la recherche de CVEs.

        ```bash
        # Nancy (Go modules)
        go list -json -m all | nancy sleuth

        # npm audit (Node.js)
        npm audit --audit-level=high

        # pip-audit (Python)
        pip-audit -r requirements.txt
        ```

        Résultat type :

        ```
        CVE-2024-12345  HIGH  github.com/some/lib v1.2.3
          Affected: <1.2.4
          Fix: upgrade to v1.2.4
        ```

        ### Politique de blocage

        ```yaml
        # Bloquer la MR si vulnérabilité critique
        variables:
          DS_EXCLUDED_ANALYZERS: ""
          DS_MAX_DEPTH: "5"

        dependency_scanning:
          allow_failure: false   # bloque le pipeline si CVE critique
        ```

    - name: "Supply chain security"
      type: text
      skills:
        - devsecops
        - securite
      content: |
        ## Supply chain security

        L'attaque de la supply chain consiste à compromettre une dépendance ou un outil de build pour infecter les utilisateurs en aval (ex: SolarWinds, Log4Shell, xz-utils).

        ### SBOM — Software Bill of Materials

        Un SBOM est un inventaire exhaustif de tous les composants d'une application.

        ```bash
        # Syft — générer un SBOM
        syft scan . -o spdx-json > sbom.spdx.json

        # Grype — scanner un SBOM pour des CVEs
        grype sbom:sbom.spdx.json
        ```

        ```json
        {
          "spdxVersion": "SPDX-2.3",
          "packages": [
            {
              "name": "github.com/go-chi/chi",
              "versionInfo": "v5.1.0",
              "licenseConcluded": "MIT"
            }
          ]
        }
        ```

        ### Sigstore / Cosign — signer les images

        ```bash
        # Signer une image après le build
        cosign sign --key cosign.key registry.example.com/myapp:v1.2.3

        # Vérifier la signature avant le déploiement
        cosign verify --key cosign.pub registry.example.com/myapp:v1.2.3
        ```

        ### Dépendances épinglées vs flottantes

        ```go
        // go.sum — hash SHA256 de chaque module
        // Garantit que tu télécharges exactement ce qui a été validé
        github.com/go-chi/chi/v5 v5.1.0 h1:acT6+...
        github.com/go-chi/chi/v5 v5.1.0/go.mod h1:DmT+...
        ```

        ```json
        // package-lock.json — équivalent npm
        // TOUJOURS commiter le lock file
        {
          "packages": {
            "node_modules/express": {
              "version": "4.19.2",
              "integrity": "sha512-...",
              "resolved": "https://registry.npmjs.org/express/-/express-4.19.2.tgz"
            }
          }
        }
        ```

        Ne jamais utiliser `latest` comme tag d'image dans un pipeline de production.

