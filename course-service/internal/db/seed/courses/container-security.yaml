    - name: "Surface d'attaque des conteneurs"
      type: text
      skills:
        - containers
        - cybersecurite
      content: |
        ## Surface d'attaque des conteneurs

        Les conteneurs partagent le kernel de l'hôte. Une mauvaise configuration peut permettre à un attaquant de s'échapper du conteneur.

        ### Le mode privileged — à éviter

        ```bash
        # À NE JAMAIS faire en production
        docker run --privileged monapp

        # Un conteneur privileged peut monter le filesystem de l'hôte :
        mount /dev/sda1 /mnt
        chroot /mnt
        # → accès complet au système hôte
        ```

        ### Linux Capabilities

        Par défaut, Docker supprime la plupart des capabilities Linux. Ne les réactive que si nécessaire.

        ```bash
        # Mauvais : réactiver toutes les caps
        docker run --cap-add=ALL monapp

        # Correct : ajouter uniquement celle dont tu as besoin
        docker run --cap-add=NET_BIND_SERVICE monapp

        # Encore mieux : supprimer toutes les caps par défaut
        docker run --cap-drop=ALL --cap-add=NET_BIND_SERVICE monapp
        ```

        ### Namespaces et isolation

        | Namespace | Isole |
        |---|---|
        | `pid` | Processus |
        | `net` | Interfaces réseau |
        | `mnt` | Système de fichiers |
        | `user` | UIDs/GIDs |
        | `ipc` | IPC (mémoire partagée) |

        Les conteneurs utilisent ces namespaces pour s'isoler du reste du système — mais pas du kernel.

    - name: "Bonnes pratiques Dockerfile"
      type: text
      skills:
        - containers
        - cybersecurite
      content: |
        ## Bonnes pratiques Dockerfile

        ### Ne jamais tourner en root

        ```dockerfile
        # Mauvais — tourne en root par défaut
        FROM node:22
        COPY . .
        CMD ["node", "server.js"]

        # Correct — utilisateur non-privilégié
        FROM node:22-alpine
        WORKDIR /app
        COPY --chown=node:node . .
        USER node
        CMD ["node", "server.js"]
        ```

        ### Multi-stage build — ne pas inclure les outils de build

        ```dockerfile
        # Stage 1 : compilation (outils de build présents)
        FROM golang:1.23-alpine AS builder
        WORKDIR /app
        COPY . .
        RUN go build -o /bin/server .

        # Stage 2 : image finale sans SDK Go
        FROM gcr.io/distroless/static-debian12
        COPY --from=builder /bin/server /server
        ENTRYPOINT ["/server"]
        ```

        L'image finale ne contient que le binaire : pas de shell, pas de package manager, surface d'attaque minimale.

        ### Images minimales

        | Image | Taille | Shell | Package manager |
        |---|---|---|---|
        | `ubuntu:latest` | ~77 MB | ✅ | ✅ |
        | `alpine:3.20` | ~7 MB | ✅ (ash) | ✅ (apk) |
        | `distroless/static` | ~2 MB | ❌ | ❌ |
        | `scratch` | 0 MB | ❌ | ❌ |

        ### Scanner les vulnérabilités

        ```bash
        # Trivy — scan de CVEs dans une image
        trivy image monapp:latest

        # Grype — alternative
        grype monapp:latest

        # Dans GitLab CI
        container_scanning:
          stage: test
          image: registry.gitlab.com/security-products/container-scanning:7
        ```

    - name: "Sécurité Kubernetes"
      type: text
      skills:
        - containers
        - cybersecurite
      content: |
        ## Sécurité Kubernetes

        ### RBAC — Role-Based Access Control

        Principe du moindre privilège : chaque service account ne doit avoir accès qu'à ce dont il a besoin.

        ```yaml
        # Role — permissions dans un namespace
        apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          namespace: production
          name: pod-reader
        rules:
          - apiGroups: [""]
            resources: ["pods"]
            verbs: ["get", "list"]  # pas de create/delete/patch
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: read-pods
          namespace: production
        subjects:
          - kind: ServiceAccount
            name: monitoring-sa
        roleRef:
          kind: Role
          name: pod-reader
          apiGroup: rbac.authorization.k8s.io
        ```

        ### Pod Security Standards

        ```yaml
        # Restreindre les pods d'un namespace
        apiVersion: v1
        kind: Namespace
        metadata:
          name: production
          labels:
            pod-security.kubernetes.io/enforce: restricted
            # restricted = pas de root, pas de privileged, caps limités
        ```

        ### Network Policies

        Par défaut, tous les pods peuvent communiquer entre eux. Les NetworkPolicies limitent ce trafic.

        ```yaml
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: deny-all-ingress
          namespace: production
        spec:
          podSelector: {}   # tous les pods
          policyTypes:
            - Ingress
          # pas de règle ingress = tout bloquer
        ```

        ### Secrets Kubernetes — chiffrement at-rest

        ```yaml
        # EncryptionConfiguration — à activer sur kube-apiserver
        apiVersion: apiserver.config.k8s.io/v1
        kind: EncryptionConfiguration
        resources:
          - resources:
              - secrets
            providers:
              - aescbc:
                  keys:
                    - name: key1
                      secret: <base64-encoded-32-byte-key>
              - identity: {}
        ```

