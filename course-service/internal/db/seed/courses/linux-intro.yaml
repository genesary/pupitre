    - name: "Navigation et système de fichiers"
      type: text
      skills:
        - linux
      content: |
        ## Navigation et système de fichiers

        Linux organise tout dans une arborescence unique qui part de `/` (la racine).

        ### Arborescence essentielle

        | Répertoire | Contenu |
        |---|---|
        | `/` | Racine du système |
        | `/home` | Répertoires personnels des utilisateurs |
        | `/etc` | Fichiers de configuration système |
        | `/var` | Données variables (logs, bases de données) |
        | `/tmp` | Fichiers temporaires (effacés au reboot) |
        | `/usr/bin` | Programmes installés |
        | `/proc` | Pseudo-FS : infos sur les processus en cours |

        ### Commandes de navigation

        ```bash
        pwd                  # affiche le répertoire courant
        ls -lah              # liste détaillée avec tailles humaines et fichiers cachés
        cd /etc              # aller dans /etc
        cd ~                 # aller dans ton home
        cd -                 # retourner au répertoire précédent
        tree -L 2            # arborescence sur 2 niveaux
        ```

        ### Manipulation de fichiers

        ```bash
        cp fichier.txt backup/     # copier
        mv ancien.txt nouveau.txt  # renommer / déplacer
        rm -rf dossier/            # supprimer récursivement (attention !)
        mkdir -p a/b/c             # créer l'arborescence en une fois
        ln -s /chemin/src lien     # créer un lien symbolique
        find / -name "*.conf" 2>/dev/null  # chercher des fichiers
        ```

    - name: "Utilisateurs, groupes et permissions"
      type: text
      skills:
        - linux
      content: |
        ## Utilisateurs, groupes et permissions

        Linux est un système multi-utilisateurs. Chaque fichier appartient à un utilisateur et un groupe.

        ### Lecture des permissions

        ```
        -rwxr-xr--  1  alice  devops  4096  Jun 30  script.sh
         ↑↑↑ ↑↑↑ ↑↑↑
         │   │   └── autres : lecture seule (r--)
         │   └────── groupe  : lecture + exécution (r-x)
         └────────── propriétaire : tout (rwx)
        ```

        | Lettre | Signification | Valeur octale |
        |---|---|---|
        | `r` | lecture | 4 |
        | `w` | écriture | 2 |
        | `x` | exécution | 1 |

        ### Modifier les permissions

        ```bash
        chmod 755 script.sh       # rwxr-xr-x (propriétaire : tout, reste : r+x)
        chmod +x script.sh        # ajouter le droit d'exécution
        chmod -R 644 /var/www/    # récursif : rw-r--r--
        chown alice:devops app/   # changer propriétaire et groupe
        ```

        ### Gestion des utilisateurs

        ```bash
        whoami                    # utilisateur courant
        id                        # uid, gid et groupes
        sudo commande             # exécuter en tant que root
        useradd -m -s /bin/bash alice   # créer un utilisateur
        usermod -aG docker alice        # ajouter alice au groupe docker
        passwd alice                    # changer le mot de passe
        ```

    - name: "Processus, services et réseau"
      type: text
      skills:
        - linux
      content: |
        ## Processus, services et réseau

        ### Gérer les processus

        ```bash
        ps aux                 # liste tous les processus
        top                    # moniteur interactif (q pour quitter)
        htop                   # version améliorée de top
        kill -9 1234           # tuer le processus PID 1234
        killall nginx          # tuer tous les processus nginx
        nohup ./script.sh &    # lancer en arrière-plan, immunisé aux déconnexions
        jobs                   # voir les tâches de la session
        ```

        ### systemd — gestion des services

        ```bash
        systemctl status nginx          # état du service
        systemctl start nginx           # démarrer
        systemctl stop nginx            # arrêter
        systemctl restart nginx         # redémarrer
        systemctl enable nginx          # démarrer au boot
        systemctl disable nginx         # ne plus démarrer au boot
        journalctl -u nginx -f          # logs du service en temps réel
        ```

        ### Commandes réseau essentielles

        ```bash
        ip addr show           # interfaces réseau et adresses IP
        ip route show          # table de routage
        ss -tlnp               # ports en écoute (remplace netstat)
        curl -I https://example.com    # en-têtes HTTP
        ping -c 4 8.8.8.8      # tester la connectivité
        traceroute 8.8.8.8     # tracer la route réseau
        nmap -sV localhost     # scanner les ports ouverts
        ```

        ### Fichiers de logs utiles

        ```bash
        /var/log/syslog        # logs système généraux (Debian/Ubuntu)
        /var/log/auth.log      # authentifications et sudo
        /var/log/nginx/        # logs nginx
        journalctl -f          # tous les logs en temps réel
        journalctl --since "1 hour ago"   # dernière heure
        ```
