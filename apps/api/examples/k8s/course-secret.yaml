---
# Git credentials secret for private course repos.
# The course-service mounts this at /etc/git-credentials/git-credentials.yaml.
# URL matching uses glob patterns (path.Match). The first match wins.
#
# Usage:
#   kubectl create secret generic course-repo-secret \
#     --from-file=git-credentials.yaml=./course-secret.yaml
#
# Or apply directly:
#   kubectl apply -f course-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: course-repo-secret
type: Opaque
stringData:
  git-credentials.yaml: |
    credentials:
      # Match all repos under github.com/paulmascarilla/
      - url: "github.com/paulmascarilla/*"
        token: "ghp_your_github_personal_access_token_here"

      # Per-repo example:
      # - url: "github.com/another-org/private-repo"
      #   token: "ghp_xxx"
