---
# ConfigMap for user-service
# Mount as file: /etc/user-service/config.yaml (+ envFrom for env-style keys)
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
  labels:
    app: user-service
data:
  config.yaml: |
    port: 8081
    databaseUrl: "postgres://pupitre:pupitre@postgres:5432/pupitre"
    jwtSecret: "change-me-in-production-use-a-long-random-string"
    jwtExpiryHours: 24
    corsOrigins:
      - "http://localhost:3000"
      - "http://localhost:5173"
    gitlab_url: "https://gitlab.com"
    oauthRedirectBase: "http://localhost:3000"
    courseServiceUrl: "http://course-service:8082"
    gitlab_client_id: ""
    gitlab_client_secret: ""
    github_client_id: ""
    github_client_secret: ""
