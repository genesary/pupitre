---
# ConfigMap for course-service
# Mount as file: /etc/course-service/config.yaml (+ envFrom for env-style keys)
apiVersion: v1
kind: ConfigMap
metadata:
  name: course-service-config
  labels:
    app: course-service
data:
  config.yaml: |
    port: 8082
    jwtSecret: "change-me-in-production-use-a-long-random-string"
    jwtExpiryHours: 24
    corsOrigins:
      - "http://localhost:3000"
      - "http://localhost:5173"
    uploadsDir: "/data/uploads"
    databaseUrl: "postgres://pupitre:pupitre@postgres:5432/pupitre"
    userServiceUrl: "http://user-service:8081"
    gitCacheTtlMinutes: 10
    gitCredentialsPath: "/etc/git-credentials/git-credentials.yaml"
    gitToken: ""
