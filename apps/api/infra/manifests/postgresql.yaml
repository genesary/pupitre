apiVersion: v1
kind: Service
metadata:
  name: pupitre-postgresql
  labels:
    app: postgresql
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgresql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pupitre-postgresql
  labels:
    app: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
        - name: postgresql
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: pupitre
            - name: POSTGRES_PASSWORD
              value: pupitre_secret
            - name: POSTGRES_DB
              value: pupitre
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "pupitre"]
            initialDelaySeconds: 5
            periodSeconds: 10
