---
# Deployment example showing ConfigMap as mounted file
apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-service
  labels:
    app: course-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: course-service
  template:
    metadata:
      labels:
        app: course-service
    spec:
      containers:
      - name: course-service
        image: course-service:latest
        ports:
        - containerPort: 8082
        env:
        - name: CONFIG_PATH
          value: /etc/course-service/config.yaml
        - name: LOG_LEVEL
          value: info
        - name: LOG_FORMAT
          value: json
        volumeMounts:
        - name: config
          mountPath: /etc/course-service
          readOnly: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
      volumes:
      - name: config
        configMap:
          name: course-service-config
---
apiVersion: v1
kind: Service
metadata:
  name: course-service
spec:
  type: ClusterIP
  ports:
  - port: 8082
    targetPort: 8082
  selector:
    app: course-service